[project]
name = "makemyjourney"
version = "0.1.0"
description = "MakeMyJourney: a Streamlit AI trip planner powered by Groq"
readme = "README.md"
authors = [
    { name = "omegamsp3", email = "mananpanwar600@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.40,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
makemyjourney = "trip_planner:main"
makemyjourney-api = "backend.app.cli:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
py-modules = ["streamlit_app"]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["backend", "backend.app", "backend.app.*", "trip_planner"]
